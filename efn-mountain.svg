<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" fill="none" role="img" aria-label="Himalayan mountains with the Nepal flag on the peak" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="efn-glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="efn-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d73d6"/>
      <stop offset="1" stop-color="#1a4aa8"/>
    </linearGradient>
    <linearGradient id="efn-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5bb8"/>
      <stop offset="1" stop-color="#0f3a8a"/>
    </linearGradient>
    <linearGradient id="efn-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0243a" stop-opacity="0"/>
      <stop offset=".25" stop-color="#e0243a"/>
      <stop offset=".75" stop-color="#e0243a"/>
      <stop offset="1" stop-color="#e0243a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft glow -->
  <ellipse cx="180" cy="95" rx="178" ry="78" fill="url(#efn-glow)"/>

